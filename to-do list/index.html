<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:500px;
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:#38bdf8;
}

.input-box{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  outline:none;
}

button{
  padding:10px 15px;
  border:none;
  background:#38bdf8;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0ea5e9;
}

ul{
  list-style:none;
  margin-top:20px;
}

li{
  background:#334155;
  padding:10px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:8px;
}

li.completed{
  text-decoration:line-through;
  opacity:0.6;
}

.actions button{
  margin-left:5px;
  background:#ef4444;
}

.actions button:first-child{
  background:#22c55e;
}
</style>
</head>

<body>

<div class="container">
  <h1>To-Do List</h1>

  <div class="input-box">
    <input type="text" id="taskInput" placeholder="Enter a task...">
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

// Load tasks on page load
window.onload = function(){
  renderTasks();
}

function addTask(){
  let input = document.getElementById("taskInput");
  let taskText = input.value.trim();

  if(taskText === "") return;

  tasks.push({
    text: taskText,
    completed: false
  });

  input.value = "";
  saveTasks();
  renderTasks();
}

function renderTasks(){
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    let li = document.createElement("li");
    if(task.completed) li.classList.add("completed");

    li.innerHTML = `
      <span onclick="toggleTask(${index})">${task.text}</span>
      <div class="actions">
        <button onclick="toggleTask(${index})">✔</button>
        <button onclick="deleteTask(${index})">✖</button>
      </div>
    `;

    list.appendChild(li);
  });
}

function toggleTask(index){
  tasks[index].completed = !tasks[index].completed;
  saveTasks();
  renderTasks();
}

function deleteTask(index){
  tasks.splice(index, 1);
  saveTasks();
  renderTasks();
}

function saveTasks(){
  localStorage.setItem("tasks", JSON.stringify(tasks));
}
</script>

</body>
</html>
